name: Tangled Cache Save
description: >
  Net-FS cache save. Drop-in for actions/cache/save: reads files under `path`
  and stores them in the cache under `key`, overwriting any existing entry.
  Cache data is carried in memory through the policy engine.
inputs:
  key:
    description: An explicit key for a cache entry
    required: true
  path:
    description: A list of files, directories, and wildcard patterns to cache
    required: true
  upload-chunk-size:
    description: Accepted for compatibility; unused (cache is carried in memory)
    default: ""
runs:
  using: node20
  main: index.ts
