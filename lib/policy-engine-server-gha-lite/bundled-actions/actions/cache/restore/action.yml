name: Tangled Cache Restore
description: >
  Net-FS cache restore. Drop-in for actions/cache/restore: restores files under
  `path` from the cache entry keyed by `key`, falling back to `restore-keys`
  prefix matches. Cache data is carried in memory through the policy engine.
inputs:
  key:
    description: An explicit key for a cache entry
    required: true
  path:
    description: A list of files, directories, and wildcard patterns to restore
    required: true
  restore-keys:
    description: An ordered list of prefix-matched keys to use for restoring stale cache
    default: ""
  fail-on-cache-miss:
    description: Fail the workflow if cache entry is not found
    default: "false"
  lookup-only:
    description: If true, only checks if cache entry exists and skips download
    default: "false"
outputs:
  cache-hit:
    description: A boolean value to indicate an exact match was found for the key
    value: ${{ steps.cache.outputs.cache-hit }}
  cache-primary-key:
    description: Cache primary key passed in the input to use in subsequent steps
    value: ${{ steps.cache.outputs.cache-primary-key }}
  cache-matched-key:
    description: Key of the cache that was restored
    value: ${{ steps.cache.outputs.cache-matched-key }}
runs:
  using: node20
  main: index.ts
